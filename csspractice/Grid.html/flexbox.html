<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
</head>
<body style="padding-bottom: 1000px;">
    <div style="display: flex; flex-direction: row;">
        <div style="background-color: darkgreen;">div1</div>
        <div style="background-color: chartreuse;">div2 <p>text</p></div>
    </div>
     <div style="display: flex; flex-direction: row; margin-top: 30px;">
        <div style="background-color: darkgreen; width: 100px;">div1</div>
        <div style="background-color: chartreuse; flex: 1;">div2 <p>text</p></div>
     </div>
    <div style="display: flex; flex-direction: row; border: 2px solid black; 
     margin-top: 30px; height: 70px; justify-content: space-between;">
        <div style="background-color: darkgreen; width: 100px;">100px</div>
        <div style="background-color: chartreuse; width: 100px;">100px</div>
        <div style="background-color: darkgreen; width: 100px; color: white;">100px</div>
    </div>
    <div style="display: flex; flex-direction: row; border: 2px solid black; 
     margin-top: 30px; height: 70px; justify-content: space-between; align-items: center;">
        <div style="background-color: darkgreen; width: 100px;">100px</div>
        <div style="background-color: chartreuse; width: 100px;">100px</div>
        <div style="background-color: darkgreen; width: 100px; color: white;">100px</div>
    </div>
</body>
</html>
