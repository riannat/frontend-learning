<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position practices</title>
</head>
<body style="height: 1000px; padding-top: 50px; padding-left: 80px;">
    <div style="
        background-color: orange;
        position: fixed; 
        top: 0px; 
        left: 0px; 
        right: 0px; 
        height: 50px;"
        >header</div>
    <div style="
        background-color: black; 
        color: white; 
        position: fixed; 
        left: 0; 
        bottom: 0; 
        top: 50px; 
        width: 72px;"
        >sidebar
        <div style="
        background-color: red;
        color: white;
        position: absolute;
        top: 0px;
        right: 0px;
        " >X</div>
        </div>
    <div style="
        background-color: brown;
        color: white;
        position: absolute;
        top: 60px;
        right: 30px;
        " >absolute</div>
    <div style="
        background-color: blue;  
        width: 200px; 
        height: 200px; 
        position: static;
        ">div1</div>
    <div style="
        background-color: blueviolet; 
        width: 200px; 
        height: 200px;
        position: relative;
        ">div2
        <div style="
        background-color: black;
        color: white;
        position: absolute;
        right: 10px;
        bottom: 10px;
        " >4:00</div>
        </div>
</body>
</html>
