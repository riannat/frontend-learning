<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <section>
<h2>Application Form</h2>
<form action="#" method="get">
    <label for="username">Enter Fullname</label>
    <input type="text" placeholder="fullname" id="username" name="name" required>
    <button type="submit">Sign In</button>
    <button type="submit">Sign Up</button>
</form>
<form>
    <label for="email">Enter Email Address</label>
    <input type="email" placeholder="email" id="email" name="email" required><br>
    <label for="pw">Enter Password</label>
    <input type="password" placeholder="password" id="pw" name="password">
    <h2>Tick your preferred career path</h2>
    <input type="check box" placeholder="password">
    <button type="submit">Submit form</button>
</form>
 </section>
